<!DOCTYPE html>

<html lang="id" class="dark">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KawanSMP Control Center</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090d11'/%3E%3Cpath d='M14 19h36v10H14zm0 16h36v10H14z' fill='none' stroke='%2310b981' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='24' r='2' fill='%2310b981'/%3E%3Ccircle cx='21' cy='40' r='2' fill='%2310b981'/%3E%3C/svg%3E">

        <script src="https://unpkg.com/lucide@latest"></script>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');



            :root {

                --bg-dark: #090d11;

                --surface: #111822;

                --surface-hover: #1b2432;

                --border: #222f3e;

                --border-light: #2e3e52;

                --text-main: #f1f5f9;

                --text-muted: #8493a8;

                --accent-green: #10b981;

                --accent-green-bg: rgba(16, 185, 129, 0.12);

                --accent-blue: #3b82f6;

                --accent-amber: #f59e0b;

                --accent-red: #ef4444;

                --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;

                --font-mono: 'JetBrains Mono', monospace;

            }



            * {

                box-sizing: border-box;

                margin: 0;

                padding: 0;

            }



            body {

                background-color: var(--bg-dark);

                color: var(--text-main);

                font-family: var(--font-sans);

                font-size: 13px;

                -webkit-font-smoothing: antialiased;

            }



            button,

            input,

            textarea {

                font-family: inherit;

                font-size: inherit;

                color: inherit;

            }



            button {

                cursor: pointer;

                border: none;

                background: none;

            }



            [hidden] {

                display: none !important;

            }



            .app-container {

                display: flex;

                flex-direction: column;

                height: 100vh;

            }



            /* HEADER */

            .top-header {

                height: 52px;

                background: var(--surface);

                border-bottom: 1px solid var(--border);

                display: flex;

                align-items: center;

                justify-content: space-between;

                padding: 0 18px;

            }



            .brand-logo {

                display: flex;

                align-items: center;

                gap: 10px;

                font-weight: 700;

                font-size: 14px;

                letter-spacing: -0.3px;

            }



            .brand-logo i {

                color: var(--accent-green);

            }



            /* LOGIN SCREEN */

            .login-backdrop {

                position: fixed;

                inset: 0;

                background: var(--bg-dark);

                z-index: 999;

                display: flex;

                align-items: center;

                justify-content: center;

            }



            .login-box {

                width: 340px;

                background: var(--surface);

                border: 1px solid var(--border);

                border-radius: 12px;

                padding: 28px;

                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);

            }



            .login-box h2 {

                font-size: 18px;

                font-weight: 700;

                margin-bottom: 6px;

            }



            .login-box p {

                color: var(--text-muted);

                font-size: 12px;

                margin-bottom: 20px;

            }



            .form-field {

                margin-bottom: 14px;

            }



            .form-field label {

                display: block;

                font-size: 11px;

                color: var(--text-muted);

                margin-bottom: 5px;

                font-weight: 600;

            }



            .form-field input {

                width: 100%;

                background: var(--bg-dark);

                border: 1px solid var(--border);

                border-radius: 6px;

                padding: 9px 12px;

                font-family: var(--font-mono);

                outline: none;

            }



            .form-field input:focus {

                border-color: var(--accent-green);

            }



            /* LAYOUT */

            .main-wrapper {

                flex: 1;

                display: grid;

                grid-template-columns: 210px 1fr;

                overflow: hidden;

            }



            .sidebar {

                background: var(--surface);

                border-right: 1px solid var(--border);

                padding: 16px 12px;

                display: flex;

                flex-direction: column;

                gap: 4px;

            }



            .nav-link {

                display: flex;

                align-items: center;

                gap: 10px;

                padding: 9px 12px;

                border-radius: 6px;

                color: var(--text-muted);

                font-weight: 500;

                transition: all 0.15s;

            }



            .nav-link:hover {

                background: var(--surface-hover);

                color: var(--text-main);

            }



            .nav-link.active {

                background: var(--accent-green-bg);

                color: var(--accent-green);

                font-weight: 600;

            }



            .main-content {

                padding: 20px 24px;

                overflow-y: auto;

                background: var(--bg-dark);

            }



            /* BUTTONS */

            .btn {

                display: inline-flex;

                align-items: center;

                justify-content: center;

                gap: 6px;

                padding: 7px 13px;

                border-radius: 6px;

                font-weight: 600;

                font-size: 12px;

                border: 1px solid var(--border);

                background: var(--surface);

                transition: all 0.15s;

            }



            .btn:hover {

                background: var(--surface-hover);

                border-color: var(--border-light);

            }



            .btn-primary {

                background: var(--accent-green);

                color: #000;

                border: none;

            }



            .btn-primary:hover {

                opacity: 0.9;

            }



            .btn-danger {

                background: rgba(239, 68, 68, 0.15);

                color: var(--accent-red);

                border-color: rgba(239, 68, 68, 0.3);

            }



            .btn-danger:hover {

                background: var(--accent-red);

                color: #fff;

            }



            .btn-icon {

                padding: 6px;

                border-radius: 4px;

                color: var(--text-muted);

            }



            .btn-icon:hover {

                color: var(--text-main);

                background: var(--surface-hover);

            }



            /* TERMINAL */

            .console-container {

                display: flex;

                flex-direction: column;

                height: calc(100vh - 120px);

                border: 1px solid var(--border);

                border-radius: 8px;

                overflow: hidden;

                background: #05080c;

            }



            .console-header {

                padding: 10px 14px;

                background: var(--surface);

                border-bottom: 1px solid var(--border);

                display: flex;

                align-items: center;

                justify-content: space-between;

            }



            .console-logs {

                flex: 1;

                padding: 14px;

                font-family: var(--font-mono);

                font-size: 12px;

                color: #34d399;

                overflow-y: auto;

                white-space: pre-wrap;

                line-height: 1.6;

            }



            .console-input-bar {

                display: flex;

                border-top: 1px solid var(--border);

                background: var(--surface);

            }



            .console-input-bar input {

                flex: 1;

                background: transparent;

                border: none;

                padding: 12px 14px;

                font-family: var(--font-mono);

                outline: none;

            }



            /* FILE EXPLORER */

            .explorer-layout {

                display: grid;

                grid-template-columns: 320px 1fr;

                gap: 16px;

                height: calc(100vh - 130px);

            }



            .explorer-pane {

                background: var(--surface);

                border: 1px solid var(--border);

                border-radius: 8px;

                display: flex;

                flex-direction: column;

                overflow: hidden;

            }



            .pane-toolbar {

                padding: 10px 12px;

                border-bottom: 1px solid var(--border);

                display: flex;

                align-items: center;

                justify-content: space-between;

                gap: 6px;

            }



            .file-list {

                flex: 1;

                overflow-y: auto;

                padding: 6px;

            }



            .file-row {

                display: flex;

                align-items: center;

                justify-content: space-between;

                padding: 7px 10px;

                border-radius: 6px;

                cursor: pointer;

                user-select: none;

                font-size: 12px;

                margin-bottom: 2px;

            }



            .file-row:hover {

                background: var(--surface-hover);

            }



            .file-row.active {

                background: var(--accent-green-bg);

                color: var(--accent-green);

            }



            .file-info {

                display: flex;

                align-items: center;

                gap: 8px;

                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;

            }



            .file-actions {
                display: flex;
                opacity: 0;
                transition: opacity 0.15s;
            }



            .file-row:hover .file-actions {

                opacity: 1;

            }



            .editor-textarea {

                flex: 1;

                background: #05080c;

                border: none;

                padding: 16px;

                font-family: var(--font-mono);

                font-size: 12px;

                color: #e2e8f0;

                resize: none;

                outline: none;

                line-height: 1.6;

            }



            .drop-highlight {

                border: 2px dashed var(--accent-green) !important;

                background: var(--accent-green-bg) !important;

            }



            .toast {

                position: fixed;

                bottom: 20px;

                right: 20px;

                background: var(--surface);

                border: 1px solid var(--border);

                padding: 10px 16px;

                border-radius: 6px;

                font-weight: 500;

                font-size: 12px;

                z-index: 1000;

                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);

                display: flex;

                align-items: center;

                gap: 8px;

            }


            /* Responsive navigation and file selection */
            .credit {
                margin-left: auto;
                margin-right: 14px;
                color: var(--text-muted);
                font: 10px var(--font-mono);
                letter-spacing: 1.5px;
            }

            .mobile-nav {
                display: none;
            }

            .file-row.active {
                background: var(--accent-green-bg);
                color: var(--accent-green);
                outline: 1px solid rgba(16, 185, 129, .25);
            }

            .file-row.active .file-actions {
                opacity: 1;
            }

            .file-row {
                min-height: 38px;
            }

            .file-actions {
                align-items: center;
                gap: 2px;
            }

            .file-actions button {
                flex-shrink: 0;
            }

            .main-content {
                min-width: 0;
            }

            .explorer-layout {
                min-width: 0;
            }

            .explorer-pane {
                min-width: 0;
            }

            .explorer-layout.editor-focused {
                grid-template-columns: minmax(0, 1fr);
                height: calc(100vh - 92px);
            }

            .editor-focused > div:first-child {
                display: none !important;
            }

            .editor-focused #drop-zone {
                display: none;
            }

            .editor-focused #editor-pane {
                height: 100%;
                min-height: 0;
            }

            .editor-focused .editor-textarea {
                min-height: 0;
                height: 100%;
            }

            #show-files-btn {
                display: none;
            }

            .editor-focused #show-files-btn {
                display: inline-flex;
            }

            .file-info span {
                overflow: hidden;
                text-overflow: ellipsis;
            }

            @media (max-width: 760px) {
                .app-container {
                    min-height: 100dvh;
                    height: 100dvh;
                }

                .top-header {
                    height: 58px;
                    flex-shrink: 0;
                    padding: 0 14px;
                }

                .credit {
                    margin-right: 8px;
                    font-size: 9px;
                    letter-spacing: .8px;
                }

                .main-wrapper {
                    display: flex;
                    flex: 1;
                    min-height: 0;
                    overflow: hidden;
                }

                .sidebar {
                    display: none;
                }

                .mobile-nav {
                    display: flex;
                    position: fixed;
                    z-index: 100;
                    left: 12px;
                    right: 12px;
                    bottom: max(10px, env(safe-area-inset-bottom));
                    min-height: 64px;
                    padding: 7px;
                    gap: 8px;
                    background: rgba(17, 24, 34, .96);
                    backdrop-filter: blur(18px);
                    border: 1px solid var(--border-light);
                    border-radius: 16px;
                    box-shadow: 0 12px 35px rgba(0, 0, 0, .38);
                }

                .mobile-nav .nav-link {
                    flex: 1;
                    justify-content: center;
                    flex-direction: column;
                    gap: 4px;
                    padding: 7px 8px;
                    font-size: 10px;
                    border-radius: 10px;
                }

                .mobile-nav .nav-link svg {
                    width: 19px;
                    height: 19px;
                }

                .main-content {
                    width: 100%;
                    padding: 16px 12px 94px;
                    overflow-y: auto;
                }

                .console-container {
                    height: min(64dvh, 620px);
                    min-height: 300px;
                }

                #tab-console>div:first-child {
                    align-items: flex-start !important;
                    flex-direction: column;
                    gap: 12px;
                }

                #tab-console>div:first-child>div:last-child {
                    width: 100%;
                    display: grid !important;
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                    gap: 6px !important;
                }

                #tab-console>div:first-child .btn {
                    padding: 9px 6px;
                    font-size: 11px;
                }

                .explorer-layout {
                    display: flex;
                    flex-direction: column;
                    height: auto;
                    gap: 12px;
                }

                .explorer-layout.editor-focused {
                    display: flex;
                    height: calc(100dvh - 170px);
                    min-height: 280px;
                }

                .editor-focused #editor-pane {
                    flex: 1;
                }

                .explorer-pane {
                    min-height: 240px;
                }

                #drop-zone {
                    min-height: 300px;
                }

                .explorer-pane:not(#drop-zone) {
                    min-height: 320px;
                }

                #tab-files>div:first-child {
                    align-items: flex-start !important;
                    flex-direction: column;
                    gap: 12px;
                }

                #tab-files>div:first-child>div:last-child {
                    display: flex;
                    flex-wrap: wrap;
                    width: 100%;
                }

                #tab-files>div:first-child .btn {
                    flex: 1;
                    padding: 9px 8px;
                }

                .pane-toolbar {
                    flex-wrap: wrap;
                }

                #active-file {
                    max-width: 48%;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                }

                .editor-textarea {
                    min-height: 240px;
                }

                .toast {
                    left: 14px;
                    right: 14px;
                    bottom: 88px;
                    justify-content: center;
                }
            }

            @media (max-width: 390px) {
                .brand-logo {
                    font-size: 12px;
                    gap: 7px;
                }

                #logout-btn {
                    padding: 7px 9px;
                }

                .main-content {
                    padding-left: 9px;
                    padding-right: 9px;
                }
            }
        </style>

</head>



<body>



    <!-- LOGIN -->

    <div id="login-screen" class="login-backdrop">

        <div class="login-box">

            <div class="brand-logo" style="margin-bottom: 12px;">

                <i data-lucide="server"></i> KawanSMP Control

            </div>

            <h2>Masuk ke Panel</h2>

            <p>Masukkan otentikasi administrator</p>

            <form id="login-form">

                <div class="form-field">

                    <label>Username</label>

                    <input type="text" id="login-user" required autocomplete="username">

                </div>

                <div class="form-field">

                    <label>Password</label>

                    <input type="password" id="login-pass" required autocomplete="current-password">

                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">

                    <i data-lucide="log-in" style="width: 14px;"></i> Masuk

                </button>

            </form>

        </div>

    </div>



    <!-- MAIN APP -->

    <div class="app-container">

        <header class="top-header">

            <div class="brand-logo">

                <i data-lucide="terminal"></i> KawanSMP Panel

            </div>

            <span class="credit">BY RAFA</span>
            <button class="btn btn-danger" id="logout-btn">

                <i data-lucide="power" style="width: 14px;"></i> Logout

            </button>

        </header>



        <div class="main-wrapper">
            <aside class="sidebar">

                <button class="nav-link active" data-tab="console">

                    <i data-lucide="terminal" style="width: 16px;"></i> Terminal

                </button>

                <button class="nav-link" data-tab="files">

                    <i data-lucide="folder-tree" style="width: 16px;"></i> File Manager

                </button>

            </aside>



            <main class="main-content">

                <!-- CONSOLE -->

                <section id="tab-console">

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">

                        <div>

                            <h2 style="font-size: 18px; font-weight: 700;">Live Console</h2>

                            <span style="color: var(--text-muted); font-size: 12px;">Pantau log server dan kirim peritah

                                RCON</span>

                        </div>

                        <div style="display:flex; gap:8px;">

                            <button class="btn" onclick="control('start')"><i data-lucide="play"
                                    style="width: 14px; color:var(--accent-green);"></i> Start</button>

                            <button class="btn" onclick="control('restart')"><i data-lucide="rotate-cw"
                                    style="width: 14px; color:var(--accent-amber);"></i> Restart</button>

                            <button class="btn btn-danger" onclick="control('stop')"><i data-lucide="square"
                                    style="width: 14px;"></i> Stop</button>

                        </div>

                    </div>



                    <div class="console-container">

                        <div class="console-header">

                            <span
                                style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">latest.log</span>

                            <i data-lucide="activity" style="width: 14px; color: var(--accent-green);"></i>

                        </div>

                        <div id="terminal" class="console-logs"></div>

                        <form id="command-form" class="console-input-bar">

                            <input id="cmd" type="text" placeholder="Ketik perintah RCON di sini..." autocomplete="off">

                            <button type="submit" class="btn btn-primary"
                                style="border-radius: 0; padding: 0 18px;">Kirim</button>

                        </form>

                    </div>

                </section>



                <!-- FILE MANAGER -->

                <section id="tab-files" hidden>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">

                        <div>

                            <h2 style="font-size: 18px; font-weight: 700;">File Explorer</h2>

                            <span style="color: var(--text-muted); font-size: 12px;">Klik 2x pada folder atau file untuk

                                berinteraksi</span>

                        </div>

                        <div style="display:flex; gap:6px;">

                            <button class="btn" onclick="createNewFile()"><i data-lucide="file-plus"
                                    style="width: 14px;"></i> File</button>

                            <button class="btn" onclick="createNewFolder()"><i data-lucide="folder-plus"
                                    style="width: 14px;"></i> Folder</button>

                            <input type="file" id="file-upload-input" multiple style="display:none;"
                                onchange="handleUpload(this.files)">

                            <button class="btn btn-primary"
                                onclick="document.getElementById('file-upload-input').click()"><i
                                    data-lucide="upload-cloud" style="width: 14px;"></i> Upload</button>

                        </div>

                    </div>



                    <div class="explorer-layout" id="explorer-layout">

                        <section class="explorer-pane" id="drop-zone">

                            <div class="pane-toolbar">

                                <span id="current-dir-label"
                                    style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">/root</span>

                                <button class="btn-icon" onclick="loadFiles(currentDir)"><i data-lucide="refresh-cw"
                                        style="width: 14px;"></i></button>

                            </div>

                            <div class="file-list" id="tree"></div>

                        </section>



                        <section class="explorer-pane" id="editor-pane">

                            <div class="pane-toolbar">

                                <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                                    <button class="btn" id="show-files-btn" type="button" onclick="showFileList()">
                                        <i data-lucide="arrow-left" style="width:14px;"></i> Daftar File
                                    </button>
                                    <span id="active-file"
                                        style="font-family: var(--font-mono); font-size: 11px;">Pilih file dari
                                        explorer</span>
                                </div>

                                <div style="display:flex; gap:6px;">

                                    <button class="btn" id="download-btn" onclick="downloadCurrentFile()" disabled><i
                                            data-lucide="download" style="width: 14px;"></i> Download</button>

                                    <button class="btn btn-primary" onclick="saveFile()"><i data-lucide="save"
                                            style="width: 14px;"></i> Simpan</button>

                                </div>

                            </div>

                            <textarea id="file-content" class="editor-textarea"
                                placeholder="// Pilih file lalu klik sekali lagi untuk membuka editor..."
                                disabled></textarea>

                        </section>

                    </div>

                </section>
            </main>
        </div>

        <nav class="mobile-nav" aria-label="Navigasi utama">
            <button class="nav-link active" type="button" data-tab="console">
                <i data-lucide="terminal" aria-hidden="true"></i>
                <span>Terminal</span>
            </button>
            <button class="nav-link" type="button" data-tab="files">
                <i data-lucide="folder-tree" aria-hidden="true"></i>
                <span>File Manager</span>
            </button>
        </nav>
    </div>



    <div id="toast" class="toast" hidden></div>



    <script>

        let currentFile = '';

        let currentDir = '';
        let selectedPath = '';

        let ws = null;



        const $ = id => document.getElementById(id);



        function notify(msg) {

            const t = $('toast');

            t.innerHTML = `<i data-lucide="info" style="width:14px;"></i> ${msg}`;

            t.hidden = false;

            lucide.createIcons();

            setTimeout(() => t.hidden = true, 3000);

        }



        async function checkAuth() {

            const res = await fetch('/api/auth/check');

            const data = await res.json();

            if (data.authenticated) {

                $('login-screen').hidden = true;

                initWS();

            } else {

                $('login-screen').hidden = false;

            }

            lucide.createIcons();

        }



        $('login-form').onsubmit = async (e) => {

            e.preventDefault();

            const res = await fetch('/api/login', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ username: $('login-user').value, password: $('login-pass').value })

            });

            if (res.ok) {

                $('login-screen').hidden = true;

                notify('Otentikasi berhasil');

                initWS();

            } else {

                notify('Username atau password salah');

            }

        };



        $('logout-btn').onclick = async () => {

            await fetch('/api/logout', { method: 'POST' });

            location.reload();

        };



        function initWS() {

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

            ws = new WebSocket(`${protocol}//${location.host}`);

            ws.onmessage = e => {

                const term = $('terminal');

                term.innerText += e.data;

                term.scrollTop = term.scrollHeight;

            };

        }



        document.querySelectorAll('.nav-link').forEach(btn => {

            btn.onclick = () => {

                const tab = btn.dataset.tab;

                document.querySelectorAll('.nav-link').forEach(b => {
                    b.classList.toggle('active', b.dataset.tab === tab);
                });

                $('tab-console').hidden = tab !== 'console';

                $('tab-files').hidden = tab !== 'files';

                if (tab === 'files') loadFiles(currentDir);

            };

        });



        async function control(action) {

            const res = await fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) });

            const data = await res.json();

            notify(data.message || data.error);

        }



        $('command-form').onsubmit = async (e) => {

            e.preventDefault();

            const input = $('cmd');

            const res = await fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: input.value }) });

            const data = await res.json();

            $('terminal').innerText += `\n> ${input.value}\n${data.output || data.error}\n`;

            input.value = '';

        };



        async function loadFiles(dir = '') {

            currentDir = dir;
            selectedPath = '';

            $('current-dir-label').textContent = '/' + dir;

            const res = await fetch(`/api/files?dir=${encodeURIComponent(dir)}`);

            const files = await res.json();

            const tree = $('tree');

            tree.innerHTML = '';



            if (dir) {

                const back = document.createElement('div');

                back.className = 'file-row';

                back.innerHTML = `<div class="file-info"><i data-lucide="corner-left-up" style="width:14px;"></i> ..</div>`;

                back.onclick = () => {

                    if (selectedPath === '__parent__') {
                        selectedPath = '';
                        const parent = dir.split('/').slice(0, -1).join('/');
                        loadFiles(parent);
                        return;
                    }

                    document.querySelectorAll('.file-row').forEach(row => row.classList.remove('active'));
                    back.classList.add('active');
                    selectedPath = '__parent__';

                };

                tree.appendChild(back);

            }



            files.forEach(f => {

                const item = document.createElement('div');

                item.className = 'file-row';

                let icon = f.isDirectory ? 'folder' : (f.name.endsWith('.zip') ? 'archive' : 'file-text');



                item.innerHTML = `

                    <div class="file-info">

                        <i data-lucide="${icon}" style="width:14px;"></i>

                        <span>${f.name}</span>

                    </div>

                    <div class="file-actions">

                        ${f.name.endsWith('.zip') ? `<button class="btn-icon" onclick="unzipFile('${f.relPath}')" title="Unzip"><i data-lucide="file-output" style="width:14px;"></i></button>` : ''}

                        ${!f.isDirectory && !f.name.endsWith('.zip') ? `<button class="btn-icon" onclick="zipFile('${f.relPath}')" title="Zip"><i data-lucide="archive" style="width:14px;"></i></button>` : ''}

                        <button class="btn-icon" onclick="renameItem('${f.relPath}', '${f.name}')" title="Rename"><i data-lucide="edit-2" style="width:14px;"></i></button>

                        <button class="btn-icon" onclick="deleteItem('${f.relPath}')" title="Hapus"><i data-lucide="trash-2" style="width:14px; color:var(--accent-red);"></i></button>

                    </div>

                `;



                item.onclick = (event) => {

                    if (event.target.closest('.file-actions')) return;

                    if (selectedPath === f.relPath) {
                        selectedPath = '';
                        if (f.isDirectory) {
                            loadFiles(f.relPath);
                        } else {
                            openFile(f.relPath);
                        }
                        return;
                    }

                    document.querySelectorAll('.file-row').forEach(row => row.classList.remove('active'));
                    item.classList.add('active');
                    selectedPath = f.relPath;

                };



                tree.appendChild(item);

            });

            lucide.createIcons();

        }

        function showFileList() {
            $('explorer-layout').classList.remove('editor-focused');
            $('tab-files').classList.remove('editor-focused');
        }


        async function openFile(file) {

            currentFile = file;

            $('active-file').textContent = file;

            $('download-btn').disabled = false;

            const res = await fetch(`/api/files/read?file=${encodeURIComponent(file)}`);

            const text = await res.text();

            $('file-content').value = text;

            $('file-content').disabled = false;
            $('explorer-layout').classList.add('editor-focused');
            $('tab-files').classList.add('editor-focused');

        }



        async function saveFile() {

            if (!currentFile) return notify('Pilih file terlebih dahulu');

            const res = await fetch('/api/files/save', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ file: currentFile, content: $('file-content').value })

            });

            const data = await res.json();

            notify(data.message || data.error);

        }



        async function createNewFile() {

            const filename = prompt('Masukkan nama file baru:');

            if (!filename) return;

            const res = await fetch('/api/files/create-file', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ dir: currentDir, filename })

            });

            const data = await res.json();

            notify(data.message || data.error);

            loadFiles(currentDir);

        }



        async function createNewFolder() {

            const foldername = prompt('Masukkan nama folder baru:');

            if (!foldername) return;

            const res = await fetch('/api/files/create-folder', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ dir: currentDir, foldername })

            });

            const data = await res.json();

            notify(data.message || data.error);

            loadFiles(currentDir);

        }



        async function deleteItem(relPath) {

            if (!confirm(`Hapus ${relPath}?`)) return;

            const res = await fetch('/api/files/delete', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ relPath })

            });

            const data = await res.json();

            notify(data.message || data.error);

            loadFiles(currentDir);

        }



        async function renameItem(oldRelPath, oldName) {

            const newName = prompt('Rename item:', oldName);

            if (!newName || newName === oldName) return;

            const res = await fetch('/api/files/rename', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ oldRelPath, newName })

            });

            const data = await res.json();

            notify(data.message || data.error);

            loadFiles(currentDir);

        }



        function downloadCurrentFile() {

            if (currentFile) window.location.href = `/api/files/download?file=${encodeURIComponent(currentFile)}`;

        }



        async function zipFile(relPath) {

            const res = await fetch('/api/files/zip', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ relPath, zipName: relPath.split('/').pop().split('.')[0] + '.zip' })

            });

            const data = await res.json();

            notify(data.message || data.error);

            loadFiles(currentDir);

        }



        async function unzipFile(relPath) {

            const res = await fetch('/api/files/unzip', {

                method: 'POST',

                headers: { 'Content-Type': 'application/json' },

                body: JSON.stringify({ relPath })

            });

            const data = await res.json();

            notify(data.message || data.error);

            loadFiles(currentDir);

        }



        const dropZone = $('drop-zone');

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drop-highlight'); };

        dropZone.ondragleave = () => dropZone.classList.remove('drop-highlight');

        dropZone.ondrop = (e) => {

            e.preventDefault();

            dropZone.classList.remove('drop-highlight');

            handleUpload(e.dataTransfer.files);

        };



        async function handleUpload(files) {

            if (!files.length) return;

            const formData = new FormData();

            for (let f of files) formData.append('files', f);



            notify('Mengupload file...');

            const res = await fetch(`/api/files/upload?dir=${encodeURIComponent(currentDir)}`, {

                method: 'POST',

                body: formData

            });

            const data = await res.json();

            notify(data.message || data.error);

            loadFiles(currentDir);

        }



        checkAuth();

    </script>

</body>



</html>
